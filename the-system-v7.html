function lunaState(s){$("#lb").className=s}
function lunaT(){const p=$("#lp");p.hidden=!p.hidden;if(p.hidden)return;$("#lc").innerHTML=["What should I do now?","Explain this page","How do I use the app?","I feel like quitting"].map(c=>`<button onclick="lunaAsk('${c}')">${c}</button>`).join("");if(!LI){LI=1;const el=lunaBub(0,"");lunaType(el,"I am Luna. Ask me anything about the app, or search a feature above.")}}
function lunaBub(user,t){const d=document.createElement("div");d.className=user?"lu":"ll";if(t)d.textContent=t;$("#lg").appendChild(d);$("#lg").scrollTop=1e9;return d}
function lunaType(el,t,cb){let i=0;lunaState("talk");const iv=setInterval(()=>{i+=2;el.textContent=t.slice(0,i);$("#lg").scrollTop=1e9;if(i>=t.length){clearInterval(iv);lunaState("");cb&&cb()}},18)}
function lunaAdd(el,id){const f=FE.find(x=>x[0]==id);if(!f)return;const b=document.createElement("button");b.textContent="Take me there: "+f[1];b.className="on";b.onclick=()=>lunaGo(id);el.appendChild(document.createElement("br"));el.appendChild(b)}
function lunaFind(q){const w=q.toLowerCase().split(/[^a-z0-9]+/).filter(x=>x.length>2&&!"where how the add can for and what want use all with".split(" ").includes(x));return FE.map(f=>{const t=f[1].toLowerCase(),k=(f[2]+" "+f[3]).toLowerCase();let s=0;w.forEach(x=>{if(t.includes(x))s+=3;if(k.includes(x))s+=2});return[s,f]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).map(x=>x[1])}
function lunaS(v){$("#lr").innerHTML=v.trim().length<2?"":lunaFind(v).slice(0,5).map(f=>`<button onclick="lunaGo('${f[0]}')">${f[1]}</button>`).join("")||'<span class="mu">No match</span>'}
function lunaGo(id){const f=FE.find(x=>x[0]==id);if(!f)return;$("#lp").hidden=true;f[4]()}
function lunaLocal(q){const l=q.toLowerCase(),nx=S.quests.find(x=>x.core&&!x.done);
if(/what should|next|do now|today/.test(l))return nx?"Your next move: "+nx.t+". Start it, do not plan it. [GO:floor]":"All core quests are clear. Open your System Box or rest. [GO:box]";
if(/explain|this page|where am i/.test(l))return PG[tab];
if(/how do i use|tour|how to use|help me start|guide/.test(l))return "1) Home: do the FLOOR quest first. 2) Study: recall cards from memory. 3) Plan: add your real backlog and set weakness. 4) Bosses: exam, SBA, dungeons. 5) Status: growth and error log. Panic and Override are on Home.";
const f=lunaFind(l)[0];return f?f[1]+": "+f[3]+" [GO:"+f[0]+"]":"I could not find that. Try words like cards, backlog, panic, exam, growth or timer."}
function lunaPrompt(q){const nx=S.quests.find(x=>x.core&&!x.done);return "You are Luna, a calm, direct guide inside THE SYSTEM, a mobile study app. Answer in under 60 words, plain text, no markdown. Use only these features:\n"+FE.map(f=>f[0]+": "+f[1]+" - "+f[3]).join("\n")+"\nPages: "+JSON.stringify(PG)+"\nStudent: "+((S.prof&&S.prof.user)||S.name)+", curriculum "+((S.prof&&S.prof.cur)||"unknown")+", country "+((S.prof&&S.prof.country)||"unknown")+"\nUser state: streak "+S.streak+", mode "+S.mode+", due cards "+due().length+", next core quest "+(nx?nx.t:"none")+", exam in "+dleft()+" days, current page "+tab+". Never advise skipping sleep. If a feature fits, end with [GO:featureid]. Question: "+q}
async function lunaAsk(q){q=(q||$("#li").value).trim();if(!q)return;$("#li").value="";lunaBub(1,q);lunaState("think");const el=lunaBub(0,"...");let out=null;
try{const sm=window.claude&&await claude.use("sample");if(sm){const r=await sm(lunaPrompt(q),{cache:false,modelTier:"quick"});out=r.text}}catch(e){out=null}
if(!out)out=lunaLocal(q);let gid=null,txt=out;const gi=out.indexOf("[GO:");if(gi>=0){gid=out.slice(gi+4,out.indexOf("]",gi)).trim();txt=out.slice(0,gi).trim()}
lunaType(el,txt,()=>gid&&lunaAdd(el,gid))}
function ovX(){const r=$("#lb").getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;return Math.hypot(cx-innerWidth/2,cy-(innerHeight-48))<70}
function lunaPos(){const p=S.lp||(S.lp={x:innerWidth-74,y:innerHeight-170,hide:0}),b=$("#lb");p.x=Math.min(Math.max(0,p.x),innerWidth-58);p.y=Math.min(Math.max(0,p.y),innerHeight-58);b.style.left=p.x+"px";b.style.top=p.y+"px";b.style.display=p.hide?"none":"grid";$("#lt").style.display=p.hide?"block":"none"}
function lunaSummon(){S.lp=S.lp||{};S.lp.hide=0;S.lp.x=innerWidth-74;S.lp.y=innerHeight-170;lunaPos();save();pop("Luna is back")}
(function(){const b=$("#lb"),x=$("#lx");let d=null;
b.addEventListener("pointerdown",e=>{if(!S)return;lunaPos();d={sx:e.clientX,sy:e.clientY,ox:S.lp.x,oy:S.lp.y,m:0};try{b.setPointerCapture(e.pointerId)}catch(z){}});
b.addEventListener("pointermove",e=>{if(!d)return;const dx=e.clientX-d.sx,dy=e.clientY-d.sy;if(Math.abs(dx)+Math.abs(dy)>6)d.m=1;if(!d.m)return;b.classList.add("drag");x.style.display="grid";b.style.left=Math.min(Math.max(0,d.ox+dx),innerWidth-58)+"px";b.style.top=Math.min(Math.max(0,d.oy+dy),innerHeight-58)+"px";x.classList.toggle("hot",ovX())});
b.addEventListener("pointerup",e=>{if(!d)return;const m=d.m,ox=d.ox,oy=d.oy,dx=e.clientX-d.sx,dy=e.clientY-d.sy;d=null;b.classList.remove("drag");x.style.display="none";x.classList.remove("hot");if(!m){lunaT();return}if(ovX()){$("#lp").hidden=true;S.lp.hide=1;lunaPos();save();return}S.lp.x=ox+dx;S.lp.y=oy+dy;lunaPos();save()});
b.addEventListener("pointercancel",()=>{d=null;b.classList.remove("drag");x.style.display="none";lunaPos()})})();
function profHtml(){const p=S.prof||{};return `<div class="w"><h3>Mission and profile</h3>${S.mission?`<p>${esc(S.mission)}</p>`:""}<div class="mu">${p.cur?esc(p.cur)+" · "+esc(p.country||"")+" · "+esc(p.lvl||"")+" "+esc(p.grade||""):"Profile not set"}</div>${p.ex?`<div class="mu">Baseline (self-reported, unverified): follow-through ${esc(p.ex)} · after a miss: ${esc(p.miss||"")}</div>`:""}<div class="mu">Self-reported scores: ${S.subs.filter(s=>s.sc).map(s=>esc(s.n)+" "+esc(s.sc)+"%").join(", ")||"none"}</div><button onclick="lunaSummon()">Summon Luna</button><button onclick="backup()">Backup</button><button onclick="restore()">Restore</button></div>`}
function backup(){dlg('<div class="mu">Copy this text and keep it safe. Paste it into Restore to recover your data.</div><textarea readonly onclick="this.select()" style="min-height:140px">'+esc(JSON.stringify(S))+'</textarea>',null,"",1)}
function restore(){dlg("Paste your backup text.",v=>{try{const o=JSON.parse(v);if(!o||!o.subs)throw 1;S=o;save();rollover();R()}catch(e){note("That backup could not be read.");R()}},"Paste backup here")}
if(S)rollover();R();setInterval(tick,1000);
</script></body></html>
